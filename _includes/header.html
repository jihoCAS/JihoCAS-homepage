<nav class="navbar jc-navbar" x-data="{ openNav: false }" aria-label="Hlavní menu">
    <div class="container">
        <div class="navbar-brand">
            <a href="{{ site.baseurl }}/" class="navbar-item jc-brand">
                <img src="{{ '/assets/img/logo-cas-kulate-bile.png' | relative_url }}" alt="Logo České astronomické společnosti" width="40" height="40">
                <span class="jc-brand-text">
                    <strong>{{ site.title }}</strong>
                    <small>Jihočeská pobočka ČAS</small>
                </span>
            </a>
            <a
                role="button"
                class="navbar-burger burger"
                aria-label="menu"
                aria-expanded="false"
                data-target="navMenu"
                :class="{ 'is-active': openNav }"
                x-on:click="openNav = !openNav"
            >
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>
        <div class="navbar-menu" id="navMenu" :class="{ 'is-active': openNav }">
            <div class="navbar-end">
                {% for item in site.data.navigation %}
                    {% assign link = item.link | relative_url %}
                    {% if item.dropdown %}
                        <div class="navbar-item has-dropdown is-hoverable">
                            <a href="{{ link }}" class="navbar-link {% if page.url contains item.link %}is-active{% endif %}">
                                {{- item.name -}}
                            </a>
                            <div class="navbar-dropdown is-boxed">
                                {% for subitem in item.dropdown %}
                                    <a href="{{ subitem.link | relative_url }}" class="navbar-item {% if subitem.link == page.url %}is-active{% endif %}">
                                        {{- subitem.name -}}
                                    </a>
                                {% endfor %}
                            </div>
                        </div>
                    {% else %}
                        <a href="{{ link }}" class="navbar-item {% if page.url contains item.link %}is-active{% endif %}">
                            {{- item.name -}}
                        </a>
                    {% endif %}
                {% endfor %}
            </div>
        </div>
    </div>
</nav>
